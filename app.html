<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sparsh Kumar — Software Engineer</title>
<meta name="description" content="Software engineer working on backend systems, retrieval pipelines, and developer tooling." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #0B0A09;
  --bg-card:      #16130F;
  --accent:       #E9A178;
  --accent-mid:   #C2693C;
  --accent-dim:   rgba(233, 161, 120, 0.10);
  --accent-glow:  rgba(233, 161, 120, 0.28);
  --cream:        #F2EAE0;
  --cream-muted:  #A89583;
  --cream-faint:  #5E5044;
  --rule:         rgba(194, 105, 60, 0.20);
  --mono:  'IBM Plex Mono', ui-monospace, monospace;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --pad:   3rem;
}

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  background-image: linear-gradient(170deg, #08080A 0%, #191A1E 45%, #0E0D0C 100%);
  background-attachment: fixed;
  color: var(--cream);
  font-family: var(--mono);
  font-weight: 300;
  font-size: 14px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

::selection { background: var(--accent); color: var(--bg); }

a { color: inherit; }

/* ── ambient ── */
.bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.orb { position: absolute; border-radius: 50%; filter: blur(90px); }
.orb-1 { width: 650px; height: 650px; background: radial-gradient(circle, rgba(190,92,42,0.24), transparent 70%); top: -160px; left: -180px; }
.orb-2 { width: 520px; height: 520px; background: radial-gradient(circle, rgba(122,62,32,0.20), transparent 70%); top: 55vh; right: -140px; }
.orb-3 { width: 420px; height: 420px; background: radial-gradient(circle, rgba(233,161,120,0.10), transparent 70%); bottom: 5vh; left: 35%; }

nav, main, footer { position: relative; z-index: 1; }

/* ── nav ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  gap: 1rem; padding: 1.15rem var(--pad);
  background: rgba(11, 10, 9, 0.72);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--rule);
}
.nav-logo { font-size: 13px; font-weight: 500; letter-spacing: 0.25em; text-decoration: none; flex-shrink: 0; }
.nav-logo span { color: var(--accent); }
.nav-links { display: flex; gap: 2rem; list-style: none; }
.nav-links a {
  font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--cream-muted); text-decoration: none;
  padding-bottom: 3px; border-bottom: 1px solid transparent; transition: color 0.2s, border-color 0.2s;
}
.nav-links a:hover, .nav-links a.active { color: var(--accent); border-color: var(--accent); }

/* ── layout ── */
section { padding: 6rem var(--pad); }
.section-header { display: flex; align-items: baseline; gap: 1.5rem; margin-bottom: 3.5rem; }
.section-number { font-size: 11px; letter-spacing: 0.2em; color: var(--cream-faint); flex-shrink: 0; }
.section-title { font-family: var(--serif); font-size: clamp(2rem, 4vw, 3rem); font-weight: 300; font-style: italic; }
.section-rule { flex: 1; height: 1px; background: var(--rule); }

/* ── hero ── */
#hero { display: grid; grid-template-columns: 1.35fr 1fr; min-height: 100vh; padding: 0; }
.hero-left { padding: 9rem var(--pad) 5rem; border-right: 1px solid var(--rule); display: flex; flex-direction: column; justify-content: center; }
.hero-right { padding: 9rem var(--pad) 5rem; display: flex; flex-direction: column; justify-content: center; position: relative; }
.hero-label { font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.75rem; }
.hero-name { font-family: var(--serif); font-size: clamp(3.5rem, 9vw, 7rem); font-weight: 300; line-height: 0.98; letter-spacing: -0.02em; margin-bottom: 1.5rem; }
.hero-name em { font-style: italic; color: var(--accent); }
.hero-title { font-family: var(--serif); font-size: clamp(1.2rem, 2.4vw, 1.7rem); font-style: italic; color: var(--cream-muted); margin-bottom: 2rem; }
.hero-tagline { color: var(--cream-muted); max-width: 46ch; margin-bottom: 2.75rem; }
.hero-cta { display: flex; gap: 1rem; flex-wrap: wrap; }
.hero-number { position: absolute; top: 6rem; right: var(--pad); font-family: var(--serif); font-size: clamp(6rem, 12vw, 12rem); font-style: italic; color: rgba(194,105,60,0.09); line-height: 1; user-select: none; pointer-events: none; }
.hero-aside { display: flex; flex-direction: column; gap: 2rem; }
.aside-block { border-left: 2px solid var(--accent); padding-left: 1.25rem; }
.aside-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cream-faint); margin-bottom: 0.35rem; }
.aside-value { font-size: 13px; }

.btn {
  font-family: var(--mono); font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase;
  text-decoration: none; padding: 0.8rem 1.9rem; border: 1px solid currentColor; cursor: pointer;
  display: inline-block; transition: background 0.25s, color 0.25s, box-shadow 0.25s, transform 0.2s;
}
.btn:hover { transform: translateY(-2px); }
.btn-primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn-primary:hover { background: transparent; color: var(--accent); box-shadow: 0 0 24px var(--accent-glow); }
.btn-ghost { background: transparent; color: var(--cream); border-color: var(--rule); }
.btn-ghost:hover { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 24px var(--accent-glow); }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; background: transparent; color: var(--cream-faint); border-color: var(--rule); }

/* ── about ── */
.about-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 5rem; }
.about-body p { font-family: var(--serif); font-size: clamp(1.1rem, 1.9vw, 1.45rem); line-height: 1.75; color: var(--cream); margin-bottom: 1.5rem; }
.meta-row { margin-bottom: 1.75rem; }
.meta-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cream-faint); margin-bottom: 0.35rem; }
.meta-value { font-size: 13px; word-break: break-word; }
.meta-value a { color: var(--accent); text-decoration: none; }
.meta-value a:hover { border-bottom: 1px solid var(--accent); }

/* ── skills ── */
.skills-grid { display: grid; grid-template-columns: repeat(2, 1fr); align-items: start; }
.skill-category { padding: 2.5rem; border-top: 1px solid var(--rule); transition: background 0.3s; border-radius: 2px; }
.skill-category:hover { background: var(--accent-dim); }
.skill-category:nth-child(odd) { padding-left: 0; }
.skill-category:nth-child(even) { border-left: 1px solid var(--rule); padding-right: 0; }
.skill-category:nth-child(-n+2) { border-top: none; padding-top: 0; }
.skill-cat-name { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.5rem; }
.skill-list { display: flex; flex-direction: column; gap: 0.6rem; }
.skill-item { display: flex; align-items: center; gap: 0.75rem; font-size: 13.5px; transition: color 0.2s, transform 0.2s; }
.skill-item:hover { color: var(--accent); transform: translateX(5px); }
.skill-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--accent); flex-shrink: 0; transition: box-shadow 0.2s; }
.skill-item:hover .skill-dot { box-shadow: 0 0 6px var(--accent); }

/* ── projects ── */
.projects-intro { color: var(--cream-muted); line-height: 1.9; max-width: 54ch; margin-bottom: 2.5rem; font-size: 13px; }
.projects-intro a { color: var(--cream); text-decoration: none; border-bottom: 1px solid var(--rule); }
.projects-intro a:hover { color: var(--accent); border-color: var(--accent); }
.project-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
.project-card {
  display: flex; flex-direction: column; justify-content: flex-end;
  min-height: 240px; padding: 1.5rem; text-decoration: none; color: inherit;
  border: 1px solid var(--rule); background: var(--bg-card); position: relative; overflow: hidden;
  transition: border-color 0.3s, box-shadow 0.3s, transform 0.3s;
}
.project-card::before { content: 'PROJECT ' attr(data-n); position: absolute; top: 1.5rem; left: 1.5rem; font-size: 10px; letter-spacing: 0.2em; color: var(--cream-faint); }
.project-card::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(233,161,120,0.07), transparent 60%); opacity: 0; transition: opacity 0.3s; }
.project-card:hover { border-color: var(--accent); box-shadow: 0 0 32px rgba(233,161,120,0.18); transform: translateY(-5px); }
.project-card:hover::after { opacity: 1; }
.project-tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--accent-dim); color: var(--accent); border: 1px solid var(--rule); padding: 0.25rem 0.6rem; width: fit-content; margin-bottom: 0.6rem; }
.project-name { font-family: var(--serif); font-size: 1.4rem; font-style: italic; color: var(--cream-faint); }
.project-card.is-live .project-name { color: var(--cream); }
.project-cue { margin-top: 0.75rem; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cream-faint); transition: color 0.3s; }
.project-arrow { display: inline-block; transition: transform 0.3s; }
.project-card:hover .project-cue { color: var(--accent); }
.project-card:hover .project-arrow { transform: translateX(4px); }

/* ── contact ── */
.contact-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5rem; align-items: center; }
.contact-heading { font-family: var(--serif); font-size: clamp(2.5rem, 4vw, 4.5rem); font-weight: 300; line-height: 1.1; margin-bottom: 1.5rem; }
.contact-heading em { font-style: italic; color: var(--accent); }
.contact-text { font-size: 13px; color: var(--cream-muted); line-height: 1.8; max-width: 42ch; margin-bottom: 2.5rem; }
.contact-links { display: flex; flex-direction: column; gap: 1rem; }
.contact-link { display: flex; align-items: center; gap: 1rem; text-decoration: none; font-size: 13px; border-bottom: 1px solid var(--rule); padding-bottom: 1rem; transition: color 0.2s, padding-left 0.25s; word-break: break-all; }
.contact-link:last-child { border-bottom: none; padding-bottom: 0; }
.contact-link:hover { color: var(--accent); padding-left: 8px; }
.contact-link-label { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cream-faint); min-width: 62px; flex-shrink: 0; }
.contact-card { padding: 3rem 2.5rem; border: 1px solid var(--rule); background: var(--bg-card); position: relative; overflow: hidden; }
.contact-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(233,161,120,0.06), transparent 60%); pointer-events: none; }
.contact-card-label { display: block; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.5rem; }
.contact-card-heading { font-family: var(--serif); font-size: clamp(1.9rem, 3.4vw, 2.6rem); font-weight: 300; line-height: 1.15; margin-bottom: 1rem; }
.contact-card-heading em { font-style: italic; color: var(--accent); }
.contact-card-text { font-size: 13px; color: var(--cream-muted); line-height: 1.8; margin-bottom: 2.25rem; max-width: 34ch; }
.contact-card-address { display: block; font-size: clamp(13px, 1.5vw, 15px); text-decoration: none; padding-bottom: 1.25rem; margin-bottom: 1.75rem; border-bottom: 1px solid var(--rule); transition: color 0.25s, border-color 0.25s; word-break: break-all; }
.contact-card-address:hover { color: var(--accent); border-color: var(--accent); }
.contact-card-alt { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-top: 1.75rem; font-size: 11px; color: var(--cream-faint); }
.contact-card-alt a { color: var(--cream-muted); text-decoration: none; border-bottom: 1px solid transparent; }
.contact-card-alt a:hover { color: var(--accent); border-color: var(--accent); }

/* ── footer ── */
footer { border-top: 1px solid var(--rule); padding: 2rem var(--pad); display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.footer-copy { font-size: 11px; color: var(--cream-faint); }
.footer-back { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cream-muted); text-decoration: none; }
.footer-back:hover { color: var(--accent); }

/* ── project detail view ── */
.detail { max-width: 900px; margin: 0 auto; padding: 9rem var(--pad) 5rem; }
.detail-back { display: inline-block; font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cream-muted); text-decoration: none; margin-bottom: 2.5rem; }
.detail-back:hover { color: var(--accent); }
.detail-number { display: block; font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent); margin-bottom: 1.25rem; }
.detail-title { font-family: var(--serif); font-size: clamp(2.75rem, 7vw, 5rem); font-weight: 300; line-height: 1.05; margin-bottom: 1.25rem; }
.detail-title em { font-style: italic; color: var(--accent); }
.detail-tagline { font-family: var(--serif); font-size: clamp(1.1rem, 2.2vw, 1.5rem); font-style: italic; color: var(--cream-muted); margin-bottom: 2rem; }
.tag-row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.tag { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; background: var(--accent-dim); color: var(--accent); border: 1px solid var(--rule); padding: 0.25rem 0.6rem; }
.detail-rule { height: 1px; background: var(--rule); margin: 3rem 0; }
.detail-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 2rem; margin-bottom: 3rem; }
.detail-section { margin-bottom: 3rem; }
.detail-section h2 { font-family: var(--serif); font-size: 1.75rem; font-weight: 300; font-style: italic; margin-bottom: 1rem; }
.detail-section p { color: var(--cream-muted); line-height: 1.9; margin-bottom: 1rem; max-width: 66ch; }
.detail-section strong { color: var(--cream); font-weight: 400; }
.detail-section code { color: var(--accent); font-size: 0.92em; }
.detail-section .stub { border-left: 2px solid var(--accent); padding: 0.75rem 0 0.75rem 1.5rem; color: var(--cream-faint); font-style: italic; }

.pipeline { border: 1px solid var(--rule); background: var(--bg-card); padding: 1.5rem; overflow-x: auto; }
.pipeline pre { font-size: 11.5px; line-height: 1.9; color: var(--cream-muted); white-space: pre; }
.pipeline .hl { color: var(--accent); }

.spec { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 13px; }
.spec th, .spec td { text-align: left; padding: 0.75rem 1rem 0.75rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
.spec th { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--cream-faint); font-weight: 400; white-space: nowrap; padding-right: 2rem; }
.spec td { color: var(--cream-muted); }
.spec tr:last-child th, .spec tr:last-child td { border-bottom: none; }

/* ── demo console ── */
.demo { border: 1px solid var(--rule); background: var(--bg-card); margin: 1.5rem 0 0; }
.demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--rule); }
.demo-bar-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
.demo-bar-note { font-size: 10.5px; color: var(--cream-faint); }
.demo-ctx { padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--rule); font-size: 11px; color: var(--cream-faint); display: flex; gap: 1.25rem; flex-wrap: wrap; }
.demo-ctx b { color: var(--cream-muted); font-weight: 400; }
.demo-body { padding: 1.5rem 1.25rem; }
.demo-qs { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
.demo-q {
  font-family: var(--mono); font-size: 11.5px; text-align: left; cursor: pointer;
  background: transparent; color: var(--cream-muted); border: 1px solid var(--rule);
  padding: 0.5rem 0.85rem; transition: color 0.2s, border-color 0.2s, background 0.2s;
}
.demo-q:hover { color: var(--accent); border-color: var(--accent); }
.demo-q.active { background: var(--accent-dim); color: var(--accent); border-color: var(--accent); }
.demo-q[disabled] { opacity: 0.4; cursor: wait; }
.demo-prompt { font-size: 12px; color: var(--cream-faint); margin-bottom: 0.5rem; letter-spacing: 0.05em; }
.demo-question { color: var(--cream); margin-bottom: 1.5rem; font-size: 13.5px; }
.demo-answer { font-size: 13.5px; line-height: 1.95; color: var(--cream); min-height: 3rem; white-space: pre-wrap; }
.demo-answer .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: -2px; animation: blink 1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.cite {
  font-family: var(--mono); font-size: 10.5px; cursor: pointer; vertical-align: super;
  background: var(--accent-dim); color: var(--accent); border: 1px solid var(--rule);
  border-radius: 2px; padding: 0 4px; margin: 0 1px; line-height: 1.4; transition: background 0.2s;
}
.cite:hover, .cite.lit { background: var(--accent); color: var(--bg); }
.demo-sources { margin-top: 2rem; border-top: 1px solid var(--rule); padding-top: 1.25rem; }
.demo-sources-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--cream-faint); margin-bottom: 1rem; }
.src { border: 1px solid var(--rule); padding: 0.9rem 1rem; margin-bottom: 0.75rem; transition: border-color 0.3s, background 0.3s; }
.src.lit { border-color: var(--accent); background: var(--accent-dim); }
.src-head { display: flex; gap: 0.75rem; align-items: baseline; flex-wrap: wrap; font-size: 10.5px; color: var(--cream-faint); letter-spacing: 0.08em; margin-bottom: 0.5rem; }
.src-n { color: var(--accent); }
.src-section { color: var(--cream-muted); }
.src-body { font-size: 12px; line-height: 1.8; color: var(--cream-muted); }
.src-link { display: inline-block; margin-top: 0.5rem; font-size: 10.5px; color: var(--cream-faint); text-decoration: none; border-bottom: 1px solid var(--rule); }
.src-link:hover { color: var(--accent); border-color: var(--accent); }
.demo-foot { padding: 0.85rem 1.25rem; border-top: 1px solid var(--rule); font-size: 10.5px; color: var(--cream-faint); display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.demo-foot a { color: var(--cream-muted); text-decoration: none; border-bottom: 1px solid var(--rule); }
.demo-foot a:hover { color: var(--accent); border-color: var(--accent); }
.demo-frame { display: block; width: 100%; height: 760px; border: 0; background: var(--bg); }
.demo-live { padding: 3rem 1.5rem; text-align: center; }
.demo-live p { color: var(--cream-muted); font-size: 13px; max-width: 46ch; margin: 0 auto 1.5rem; line-height: 1.9; }

/* ── reveal ── */
.reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.7s ease, transform 0.7s ease; }
.reveal.in { opacity: 1; transform: none; }
.d1 { transition-delay: 0.1s; } .d2 { transition-delay: 0.22s; } .d3 { transition-delay: 0.34s; } .d4 { transition-delay: 0.46s; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
  html { scroll-behavior: auto; }
}

/* ── responsive ── */
@media (max-width: 1000px) {
  :root { --pad: 1.5rem; }
  nav { flex-wrap: wrap; gap: 0.75rem 1.25rem; padding: 0.9rem var(--pad); }
  .nav-links { gap: 1.25rem; flex-wrap: wrap; }
  .nav-links a { font-size: 10px; letter-spacing: 0.1em; }
  section { padding: 4rem var(--pad); }
  #hero { grid-template-columns: 1fr; min-height: auto; }
  .hero-left { padding: 7rem var(--pad) 3rem; border-right: none; border-bottom: 1px solid var(--rule); }
  .hero-right { padding: 2.5rem var(--pad) 4rem; }
  .hero-number { font-size: 5rem; top: 1rem; }
  .about-grid, .contact-grid { grid-template-columns: 1fr; gap: 2.5rem; }
  .skills-grid { grid-template-columns: 1fr; }
  .skill-category { padding: 1.5rem 0; border-left: none !important; border-top: 1px solid var(--rule); padding-left: 0 !important; padding-right: 0 !important; }
  .skill-category:first-child { border-top: none; padding-top: 0; }
  .skill-category:nth-child(2) { border-top: 1px solid var(--rule); padding-top: 1.5rem; }
  .project-grid { grid-template-columns: 1fr; }
  .detail { padding: 7rem var(--pad) 4rem; }
  .demo-frame { height: 560px; }
  .demo-q { font-size: 11px; }
}
</style>
</head>
<body>

<div class="bg-orbs" aria-hidden="true">
  <div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div>
</div>

<nav>
  <a class="nav-logo" href="#/">SK<span>.</span></a>
  <ul class="nav-links">
    <li><a href="#/about">About</a></li>
    <li><a href="#/skills">Skills</a></li>
    <li><a href="#/projects">Projects</a></li>
    <li><a href="#/contact">Contact</a></li>
  </ul>

/* ═══════════════════════════════════════════════════════════════════
   Demo engine — streams a captured answer, wires citations to sources
   ═══════════════════════════════════════════════════════════════════ */

let streamTimer = null;

function renderCites(text) {
  return esc(text).replace(/\[(\d+)\]/g, (_, n) => `<button class="cite" data-n="${n}">${n}</button>`);
}

function runTurn(i) {
  const turn = DEMO.turns[i];
  const out = document.getElementById("demo-out");
  if (!turn || !out) return;

  clearTimeout(streamTimer);
  document.querySelectorAll(".demo-q").forEach((b, j) => {
    b.classList.toggle("active", j === i);
    b.disabled = true;
  });

  out.innerHTML = `
    <p class="demo-question">${esc(turn.q)}</p>
    <div class="demo-answer" id="demo-answer"></div>
    <div class="demo-sources" id="demo-srcs" hidden>
      <p class="demo-sources-label">Sources — retrieved before the answer was written</p>
      ${turn.sources.map((s) => `
        <div class="src" data-n="${s.n}">
          <div class="src-head">
            <span class="src-n">[${s.n}]</span>
            <span>${esc(DEMO.company)}</span>
            <span class="src-section">${esc(s.section)}</span>
          </div>
          <p class="src-body">"${esc(s.excerpt)}"</p>
          <a class="src-link" href="https://www.sec.gov/edgar/searchedgar/companysearch" target="_blank" rel="noopener">SEC.gov ↗</a>
        </div>`).join("")}
    </div>`;

  const answerEl = document.getElementById("demo-answer");
  const srcsEl = document.getElementById("demo-srcs");
  const full = turn.a;
  let n = 0;

  (function step() {
    // Background tabs throttle timers to ~1s, which would leave the answer
    // crawling for minutes. If the tab isn't visible, just finish.
    n = document.hidden ? full.length : Math.min(full.length, n + 2);
    answerEl.innerHTML = renderCites(full.slice(0, n)) + (n < full.length ? '<span class="cursor"></span>' : "");
    if (n < full.length) {
      streamTimer = setTimeout(step, 12);
    } else {
      srcsEl.hidden = false;
      document.querySelectorAll(".demo-q").forEach((b) => (b.disabled = false));
    }
  })();
}

function litCitation(n) {
  document.querySelectorAll(".src").forEach((s) => s.classList.toggle("lit", s.dataset.n === n));
  document.querySelectorAll(".cite").forEach((c) => c.classList.toggle("lit", c.dataset.n === n));
  const target = document.querySelector(`.src[data-n="${n}"]`);
  if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
}

   ═══════════════════════════════════════════════════════════════════ */

function render() {
  const hash = location.hash.replace(/^#\/?/, "");
  clearTimeout(streamTimer);

  if (hash.startsWith("p/")) {
    const p = PROJECTS.find((x) => x.slug === hash.slice(2));
    if (p) {
      document.title = `${p.name} — Sparsh Kumar`;
      view.innerHTML = projectHTML(p);
      setTimeout(() => window.scrollTo(0, 0), 0);
      afterRender();
      return;
    }
  }

  document.title = "Sparsh Kumar — Software Engineer";
  view.innerHTML = homeHTML();
  // The browser runs its own scroll restoration after this handler, so a
  // synchronous scroll here gets overwritten. Defer to the next frame.
  const target = hash && document.getElementById(hash);
  // rAF does not fire in a background tab; setTimeout does.
  setTimeout(() => {
    if (target) target.scrollIntoView({ behavior: "auto", block: "start" });
    else window.scrollTo(0, 0);
  }, 0);
  afterRender();
}

function afterRender() {
  const io = new IntersectionObserver(
    (entries) => entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }),
    { threshold: 0.12 }
  );
  document.querySelectorAll(".reveal").forEach((el) => io.observe(el));

  const launch = document.getElementById("demo-launch");
  if (launch) {
    launch.addEventListener("click", () => {
      const frame = document.createElement("iframe");
      frame.className = "demo-frame";
      frame.src = LIVE_DEMO_URL;
      frame.loading = "lazy";
      frame.title = "Filings Dashboard — live app";
      document.getElementById("demo-live-stage").replaceWith(frame);
    });
  }

  markNav();
}

function markNav() {
  const hash = location.hash.replace(/^#\/?/, "");
  document.querySelectorAll(".nav-links a").forEach((a) => {
    a.classList.toggle("active", a.getAttribute("href") === "#/" + hash);
  });
}

/* Delegated clicks: demo questions and citations. */
document.addEventListener("click", (e) => {
  const q = e.target.closest(".demo-q");
  if (q) { runTurn(Number(q.dataset.i)); return; }
  const c = e.target.closest(".cite");
  if (c) { litCitation(c.dataset.n); return; }
  const s = e.target.closest(".src");
  if (s) litCitation(s.dataset.n);
});

/* Scroll-spy on the home view. */
let spyTick;
window.addEventListener("scroll", () => {
  if (location.hash.includes("/p/")) return;
  clearTimeout(spyTick);
  spyTick = setTimeout(() => {
    const secs = [...document.querySelectorAll("section[id]")];
    const cur = secs.filter((s) => s.getBoundingClientRect().top <= 120).pop();
    if (!cur) return;
    document.querySelectorAll(".nav-links a").forEach((a) => {
      a.classList.toggle("active", a.getAttribute("href") === "#/" + cur.id);
    });
  }, 80);
}, { passive: true });

if ("scrollRestoration" in history) history.scrollRestoration = "manual";
window.addEventListener("hashchange", render);
render();
</script>
